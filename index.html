<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dot Blob Type — Car Esperanto 패턴 변환기</title><meta name="description" content="영어 문장을 24가지 구조의 추상 패턴으로 바꾸는 변환기. 한동대 디그리쇼 5조 CAR ESPERANTO."><style>body{background:#EEECE7}</style></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Syne:wght@800&family=Unbounded:wght@900&family=Instrument+Serif&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #ECEAE5;
    --panel: #F6F5F2;
    --line: #D6D3CC;
    --ink: #1C1B19;
    --muted: #6E6B64;
    --accent: #5C3A1E;
    --field: #FFFFFF;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "IBM Plex Sans", -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17171A; --panel: #202024; --line: #34343A; --ink: #ECEAE5; --muted: #9A978F; --field: #131316;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17171A; --panel: #202024; --line: #34343A; --ink: #ECEAE5; --muted: #9A978F; --field: #131316;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 14px; line-height: 1.5;
    padding-block: 20px 40px; padding-inline: 20px;
  }
  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  header h1 { font-family: var(--mono); font-weight: 500; font-size: 15px; letter-spacing: .04em; margin: 0; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  .app { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 860px) { .app { grid-template-columns: 1fr; } }
  aside { background: var(--panel); border: 1px solid var(--line); padding: 16px; display: grid; gap: 14px; }
  .group { display: grid; gap: 8px; }
  .group + .group { border-top: 1px solid var(--line); padding-top: 12px; }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  label.row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; font-size: 13px; }
  label.row output { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  label.row input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 0; }
  textarea, select, input[type=number] {
    width: 100%; font: inherit; color: var(--ink); background: var(--field);
    border: 1px solid var(--line); padding: 8px 10px; border-radius: 0;
  }
  textarea { font-family: var(--mono); resize: vertical; min-height: 64px; }
  #preview { font-weight: 900; font-size: 22px; line-height: 1.1; white-space: pre-wrap; word-break: break-all; color: var(--ink); border: 1px dashed var(--line); padding: 6px 8px; min-height: 36px; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .check input { accent-color: var(--accent); margin: 0; }
  input:disabled { opacity: .35; }
  .colors { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .colors label { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .colors input[type=color] { width: 34px; height: 26px; padding: 0; border: 1px solid var(--line); background: none; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    font: inherit; font-size: 13px; padding: 7px 12px; cursor: pointer; border-radius: 0;
    border: 1px solid var(--ink); background: transparent; color: var(--ink);
  }
  button.primary { background: var(--ink); color: var(--bg); }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  main { display: grid; gap: 10px; min-width: 0; }

<header>
  <h1>DOT BLOB TYPE</h1>
  <p>영어 문장을 격자에 얹어 무늬로 녹입니다. 글자는 재료일 뿐 — 결과가 글자로 읽히면 실패입니다.</p>
</header>

<div class="app">
  <aside>
    <div class="group">
      <span class="eyebrow">Text</span>
      <textarea id="text" spellcheck="false">miami</textarea>
      <div class="btns">
        <button id="azUpper" type="button">A–Z</button>
        <button id="azLower" type="button">a–z</button>
        <button id="az09" type="button">A–Z + 0–9</button>
      </div>
      <div id="preview" aria-label="원문 미리보기"></div>
      <select id="font">
        <option value="Archivo Black" selected>Archivo Black — 굵은 산세리프</option>
        <option value="Unbounded">Unbounded — 넓고 둥근</option>
        <option value="Syne">Syne — 기하학적</option>
        <option value="Instrument Serif">Instrument Serif — 세리프</option>
      </select>
    </div>

    <div class="group">
      <span class="eyebrow">Grid</span>
      <label class="row"><span>가로 셀 수 (성김 ↔ 촘촘)</span><output id="colsV">14</output><input type="range" id="cols" min="6" max="90" value="14"></label>
      <label class="row"><span>단계 수 (아래로 점점 촘촘히)</span><output id="levelsV">3</output><input type="range" id="levels" min="1" max="6" value="3"></label>
      <label class="row"><span>글자 숨김 (탈락·흩뿌림·물결 어긋남)</span><output id="hideV">0.5</output><input type="range" id="hide" min="0" max="1" step="0.02" value="0.5"></label>
      <label class="row"><span>단계 배율 (다음 단계가 몇 배 촘촘해지나)</span><output id="mulV">1.9</output><input type="range" id="mul" min="1.05" max="6" step="0.05" value="1.9"></label>
    </div>

    <div class="group">
      <span class="eyebrow">Structure</span>
      <select id="mode">
        <option value="pos" selected>양각 — 점을 찍고 다리로 잇기</option>
        <option value="neg">음각 — 면을 채우고 모서리를 원으로 파기</option>
        <option value="quarter">쿼터 타일 — 밝기만큼 모서리를 4분원으로 깎기</option>
        <option value="grid">가변 격자 — 늘어난 검은 격자 속 흰 창을 밝기만큼 열기</option>
        <option value="quad">쿼드트리 — 경계만 잘게 쪼개고, 중간 톤은 안에 원을 넣기</option>
        <option value="pill">캡슐 렌즈 — 흐려진 글자를 세로 캡슐들이 굴절시켜 보여주기</option>
        <option value="vasa">회전 타일 — 반원이 이웃을 파고드는 회색조 C자 타일</option>
        <option value="lens">렌즈 격자 — 격자선 위에 어두울수록 부푸는 렌즈 모양</option>
        <option value="bau">타일 벽 — 흰 타일 위에 4분원·반원을 드문드문 놓기</option>
        <option value="star">별 격자 — 45° 둥근 사각형 격자, 어두울수록 꼭짓점의 별이 커짐</option>
        <option value="patch">X 패치워크 — 구역마다 다른 크기·색·굵기의 X 하프톤을 겹쳐 붙이기</option>
        <option value="ascii">글리프 램프 — 밝기 띠마다 · / X ✱ ■ 로 바뀌는 타자기 하프톤</option>
        <option value="moon">반달 타일 — 4분원 타일이 모여 원과 뒤집힌 원을 만드는 흑백 반전</option>
        <option value="tri">삼각 직물 — 두 색 지그재그 삼각형 띠, 어두울수록 잘게, 꼭짓점엔 흰 점</option>
        <option value="motif">모티프 타일 — 큰 타일마다 별·원·반원 같은 기하 도형 하나씩</option>
        <option value="blocks">반쪽 타일 — 2×2 타일의 절반·L자를 채우고 모서리 하나씩 둥글리기</option>
        <option value="drop">접힌 원 — 한 귀퉁이만 각진 원에 회전 그라데이션, 드문드문 흩어 놓기</option>
        <option value="iso">아이소 벽면 — 기울어진 면마다 마름모 하프톤, 지붕선에서 어둡게 시작</option>
        <option value="bayer">오더드 디더 — 번진 글자를 8×8 바이어 행렬로 잘게 점찍기</option>
        <option value="poster">포스터 4분원 — 큰 4분원이 이웃과 맞물려 원·반원을 이루는 성긴 구성</option>
        <option value="rhomb">마름모 산란 — 육각 격자 위 세 방향 마름모, 어두울수록 빽빽하게</option>
        <option value="cube">큐브 하프톤 — 육각형을 세 면으로 나누고, 밝을수록 면이 가는 선으로 줄어듦</option>
        <option value="stamp">도장 타일 — 둥근 색 타일에 선·원·틈을 파낸 도자 타일 벽</option>
        <option value="pix">둥근 픽셀 — 채운 칸을 한 덩어리로 잇고 바깥은 볼록, 안쪽은 오목하게 둥글리기</option>
      </select>
      <label class="row" id="lbiasRow" hidden><span>방향 편향 (가로 렌즈 ↔ 세로 렌즈)</span><output id="lbiasV">0</output><input type="range" id="lbias" min="-1" max="1" step="0.05" value="0"></label>
      <label class="row" id="tonesRow" hidden><span>회색 단계 수</span><output id="tonesV">9</output><input type="range" id="tones" min="2" max="14" step="1" value="9"></label>
      <label class="row" id="pillhRow" hidden><span>캡슐 길이 (너비 대비)</span><output id="pillhV">3</output><input type="range" id="pillh" min="1.5" max="9" step="0.5" value="3"></label>
      <label class="row" id="refrRow" hidden><span>굴절 (가로 확대)</span><output id="refrV">1.3</output><input type="range" id="refr" min="1" max="2" step="0.05" value="1.3"></label>
      <label class="row" id="warpRow" hidden><span>격자 왜곡 (열·행 너비 편차)</span><output id="warpV">0.8</output><input type="range" id="warp" min="0" max="1" step="0.02" value="0.8"></label>
      <label class="row" id="bgdRow" hidden><span>여백 무늬 밀도 (0이면 글자만)</span><output id="bgdV">0.3</output><input type="range" id="bgd" min="0" max="1" step="0.02" value="0.3"></label>
      <label class="row"><span id="dotLabel">점 크기</span><output id="dotV">0.92</output><input type="range" id="dot" min="0.4" max="1.2" step="0.02" value="0.92"></label>
      <label class="row"><span>연결 두께</span><output id="bridgeV">0.6</output><input type="range" id="bridge" min="0" max="1" step="0.05" value="0.6"></label>
      <label class="row"><span>연결 부드러움 (목 곡률)</span><output id="smoothV">0.6</output><input type="range" id="smooth" min="0" max="1.5" step="0.05" value="0.6"></label>
      <label class="check"><input type="checkbox" id="diag"> 대각선도 연결</label>
    </div>

    <div class="group">
      <span class="eyebrow">Noise</span>
      <label class="row"><span>채움 문턱</span><output id="thrV">0.45</output><input type="range" id="thr" min="0.1" max="0.9" step="0.01" value="0.45"></label>
      <label class="row"><span>흔들림 (경계 무작위)</span><output id="noiseV">0.35</output><input type="range" id="noise" min="0" max="1" step="0.01" value="0.35"></label>
      <label class="row"><span id="sprLabel">흩뿌린 작은 점</span><output id="sprV">0.4</output><input type="range" id="spr" min="0" max="1" step="0.01" value="0.4"></label>
      <label class="row"><span>시드</span><output id="seedV">7</output><input type="range" id="seed" min="1" max="999" value="7"></label>
    </div>

    <div class="group">
      <span class="eyebrow">Color</span>
      <div class="colors">
        <label><input type="color" id="ink" value="#5C3A1E"> 점</label>
        <label><input type="color" id="paper" value="#ECEAE5"> 바탕</label>
        <label><input type="color" id="ink2" value="#7CC4E8"> 보조 1</label>
        <label><input type="color" id="ink3" value="#141312"> 보조 2</label>
      </div>
    </div>

    <div class="group">
      <span class="eyebrow">Export</span>
      <div class="btns">
        <button id="shuffle">다시 섞기</button>
        <button id="copySvg" class="primary">SVG 코드 복사</button>
        <button id="dlSvg">SVG 저장</button>
        <button id="dlPng">PNG 저장</button>
      </div>
      <p style="margin:0;font-size:12px;color:var(--muted)">저장 버튼이 막힌 환경이면 SVG 코드를 복사해 Figma나 Illustrator에 붙여넣으세요.</p>
    </div>
  </aside>

  <main>
    <div class="stage" id="stage"><canvas id="cv"></canvas></div>
    <div class="status"><span id="info">—</span><span id="toast" class="toast"></span></div>
    <details id="svgDetails"><summary>SVG 코드 보기</summary><pre id="svgOut"></pre></details>
  </main>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const ids = ['cols','levels','mul','dot','bridge','thr','noise','spr','seed','warp','bgd','smooth','pillh','refr','tones','lbias','hide'];
  const cv = $('cv'), ctx = cv.getContext('2d');
  let lastSvg = '', svgOn = false, raf = 0;

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function params() {
    const p = {};
    ids.forEach(id => p[id] = parseFloat($(id).value));
    p.text = $('text').value.replace(/\r/g, '');
    p.font = $('font').value;
    p.diag = $('diag').checked;
    p.mode = $('mode').value;
    p.ink = $('ink').value;
    p.paper = $('paper').value; p.ink2 = $('ink2').value; p.ink3 = $('ink3').value;
    return p;
  }

  // Rasterise text into a cols×rows coverage grid (0..1 per cell)
  function coverageGrid(text, font, cols) {
    const S = 6; // sub-samples per cell side
    const lines = text.split('\n').filter(l => l.length);
    if (!lines.length) return { cols, rows: 0, cov: [] };
    const off = document.createElement('canvas');
    const oc = off.getContext('2d');
    const probe = 100;
    oc.font = `900 ${probe}px "${font}"`;
    const maxW = Math.max(...lines.map(l => oc.measureText(l).width));
    const targetW = cols * S * 0.9;
    const fs = probe * targetW / maxW;
    const lineH = fs * 1.05;
    const pad = fs * 0.1;
    const rows = Math.ceil((lines.length * lineH + pad * 2) / S);
    off.width = cols * S; off.height = rows * S;
    oc.fillStyle = '#000';
    oc.font = `900 ${fs}px "${font}"`;
    oc.textBaseline = 'alphabetic';
    lines.forEach((l, i) => oc.fillText(l, cols * S * 0.05, pad + lineH * i + fs * 0.8));
    const d = oc.getImageData(0, 0, off.width, off.height).data;
    const cov = new Float32Array(cols * rows);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      let sum = 0;
      for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
        sum += d[((r * S + y) * off.width + (c * S + x)) * 4 + 3];
      }
      cov[r * cols + c] = sum / (S * S * 255);
    }
    return { cols, rows, cov };
  }

  // Soft raster of the text for the capsule-lens mode: ink on paper, blurred, height snapped to whole capsule rows
  function pillLevel(p, cols) {
    const U = 32, capH = p.pillh;
    const lines = p.text.split('\n').filter(l => l.length);
    if (!lines.length) return null;
    const off = document.createElement('canvas'), oc = off.getContext('2d');
    oc.font = `900 100px "${p.font}"`;
    const maxW = Math.max(...lines.map(l => oc.measureText(l).width));
    const fs = 100 * (cols * U * 0.9) / maxW, lineH = fs * 1.05, pad = fs * 0.15;
    const textH = lines.length * lineH + pad * 2;
    const capRows = Math.max(1, Math.ceil(textH / (capH * U)));
    off.width = cols * U; off.height = capRows * capH * U;
    oc.fillStyle = p.paper; oc.fillRect(0, 0, off.width, off.height);
    oc.fillStyle = p.ink; oc.font = `900 ${fs}px "${p.font}"`;
    oc.filter = `blur(${((p.noise * 0.4 + p.hide * 0.5) * U).toFixed(1)}px)`;
    const y0 = (off.height - textH) / 2 + pad;
    lines.forEach((l, i) => oc.fillText(l, cols * U * 0.05, y0 + lineH * i + fs * 0.8));
    oc.filter = 'none';
    return { pill: { img: off, capH, capRows }, cols, rows: capRows * capH, circles: [], lines: [], squares: [], holes: [], wedges: [], polys: [], rects: null, quads: null, bw: 0 };
  }

  // Wide separable box blur run 3× (≈ gaussian); radius R in cells
  function wideBlur(a, cols, rows, R) {
    const cl = (v, m) => Math.max(0, Math.min(m - 1, v));
    const boxH = a => { const o = new Float32Array(a.length); for (let r = 0; r < rows; r++) { let sum = 0; for (let c = -R; c <= R; c++) sum += a[r * cols + cl(c, cols)]; for (let c = 0; c < cols; c++) { o[r * cols + c] = sum / (2 * R + 1); sum += a[r * cols + cl(c + R + 1, cols)] - a[r * cols + cl(c - R, cols)]; } } return o; };
    const boxV = a => { const o = new Float32Array(a.length); for (let c = 0; c < cols; c++) { let sum = 0; for (let r = -R; r <= R; r++) sum += a[cl(r, rows) * cols + c]; for (let r = 0; r < rows; r++) { o[r * cols + c] = sum / (2 * R + 1); sum += a[cl(r + R + 1, rows) * cols + c] - a[cl(r - R, rows) * cols + c]; } } return o; };
    let t = Float32Array.from(a); for (let k = 0; k < 3; k++) t = boxV(boxH(t)); return t;
  }

  // Disguise: break the letterforms before any structure sees them — wave shear per row, random dropout inside
  // the glyph, random salt outside it. Strength h in 0..1.
  function disguise(grid, h, rng) {
    if (h <= 0) return grid;
    const { cols, rows, cov } = grid, out = new Float32Array(cov.length), phase = rng() * 6.28, freq = 0.5 + rng() * 0.6;
    for (let r = 0; r < rows; r++) {
      const dx = Math.round(h * 2.5 * Math.sin(r * freq + phase));
      for (let c = 0; c < cols; c++) { const sc = c - dx; out[r * cols + c] = (sc >= 0 && sc < cols) ? cov[r * cols + sc] : 0; }
    }
    for (let i = 0; i < out.length; i++) {
      if (out[i] > 0.5 && rng() < h * 0.35) out[i] = 0;
      else if (out[i] < 0.05 && rng() < h * 0.10) out[i] = 0.6 + rng() * 0.4;
    }
    return { cols, rows, cov: out };
  }

  // Decide per cell: 2 = full dot, 1 = small sprinkle, 0 = empty
  function classify(grid, p, rng) {
    const { cols, rows, cov } = grid;
    const cell = new Uint8Array(cols * rows);
